<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Fotografía de proyecto pendiente</title>
  <desc id="desc">Marcador visual temporal para un caso de proyecto de Shiro Telecom</desc>
  <defs>
